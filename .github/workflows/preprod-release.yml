name: Manual pre-production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a specific SHA tag or roll back to the previous successful release
        required: true
        type: choice
        options:
          - deploy
          - rollback
      image_tag:
        description: Full 40-character commit SHA. Required for deploy; optional for rollback.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: preproduction-deployment
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.operation }}-preprod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: preproduction
    steps:
      - name: Validate release request and configure SSH
        env:
          OPERATION: ${{ inputs.operation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_HOST: ${{ vars.PREPROD_HOST }}
          DEPLOY_PORT: ${{ vars.PREPROD_PORT || '22' }}
          DEPLOY_USER: ${{ vars.PREPROD_USER || 'fishing-deploy' }}
          SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREPROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "PREPROD_HOST is missing"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "PREPROD_SSH_KEY is missing"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "PREPROD_KNOWN_HOSTS is missing"; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "PREPROD_PORT must be numeric"; exit 1; }
          if [[ "$OPERATION" == deploy ]]; then
            [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Deploy requires a full 40-character lowercase commit SHA in image_tag"; exit 1;
            }
          elif [[ "$OPERATION" == rollback ]]; then
            if [[ -n "$IMAGE_TAG" ]]; then
              [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
                echo "image_tag must be empty or a full 40-character lowercase commit SHA"; exit 1;
              }
            fi
          else
            echo "Unsupported operation: $OPERATION"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/preprod_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/preprod_ed25519" "$HOME/.ssh/known_hosts"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "OPERATION=$OPERATION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Run requested pre-production operation
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == rollback && -z "$IMAGE_TAG" ]]; then
            REMOTE_COMMAND="sudo /usr/local/sbin/fishing-preprod-release rollback"
          else
            REMOTE_COMMAND="sudo /usr/local/sbin/fishing-preprod-release $OPERATION $IMAGE_TAG"
          fi
          ssh -i "$HOME/.ssh/preprod_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
