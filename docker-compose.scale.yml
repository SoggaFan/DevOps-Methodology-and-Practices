# Optional extension: Nginx and two API instances. Run with --profile scale.
services:
  # Disable the single-instance service from the base Compose file in scale mode.
  api:
    profiles: ["single"]

  api1:
    profiles: ["scale"]
    image: fishing-firm-api:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fishing}
      DB_USER: fishing_app
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      INSTANCE_ID: api-1
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128

  api2:
    profiles: ["scale"]
    image: fishing-firm-api:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fishing}
      DB_USER: fishing_app
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      INSTANCE_ID: api-2
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128

  nginx:
    profiles: ["scale"]
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24-perl@sha256:4469a6d5d701ca7a16b92b3cd66163a77c902bb120eb81c9959f0c40ad6e46ee
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 64
